name: Check Codes

on:
  push:
    paths:
      - '**.java'
      - '**.properties'
  pull_request:
    paths:
      - '**.java'
      - '**.properties'

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Check Codes
        run: ./gradlew checkstyle checkTranslations --no-daemon --parallel --stacktrace
      - if: failure()
        name: Save PR Number
        run: echo ${{ github.event.number }} > PULL_REQUEST_NUMBER
      - if: failure()
        name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-artifact
          path: |
            PULL_REQUEST_NUMBER
            **/build/reports/checkstyle/main.xml
          if-no-files-found: ignore
