name: Check Codes

on:
  push:
    paths:
      - '**.java'
      - '**.properties'
  pull_request:
    paths:
      - '**.java'
      - '**.properties'

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - if: github.event_name == 'pull_request'
        name: Setup reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.0

      - if: github.event_name == 'pull_request'
        name: Setup editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@main

      - name: Run Code Checks (EditorConfig & Gradle)
        run: |
          ARTIFACT_DIR="${{ runner.temp }}/artifact"
          mkdir -p "$ARTIFACT_DIR"

          echo "${{ github.event.number }}" > "$ARTIFACT_DIR/PULL_REQUEST_NUMBER"
          REPORT_FILE="$ARTIFACT_DIR/ALL_REPORTS.jsonl"
          > "$REPORT_FILE"

          HAS_ERROR=0

          echo "Running Gradle checks..."
          if ! ./gradlew checkstyle checkTranslations --no-daemon --parallel --stacktrace; then
            HAS_ERROR=1
          fi

          if [ "$HAS_ERROR" -eq 1 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Processing Checkstyle reports..."
            find . -path "*/build/reports/checkstyle/*.xml" | while read -r xml_file; do
              if [ -s "$xml_file" ]; then
                echo "Processing $xml_file..."
                reviewdog -f=checkstyle -name="checkstyle" -reporter=rdjsonl -filter-mode=nofilter < "$xml_file" >> "$REPORT_FILE"
              else
                echo "Skipping empty or missing report: $xml_file"
              fi
            done
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running editorconfig-checker..."
            if ! editorconfig-checker -f codeclimate 2>/dev/null \
              | jq -c '.[]? // empty | {
                  message: .description,
                  location: {
                    path: .location.path,
                    range: {
                      start: {
                        line: (.location.lines.begin // .location.line // 1),
                        column: 1
                      },
                      end: {
                        line: (.location.lines.end // .location.lines.begin // .location.line // 1),
                        column: 1
                      }
                    }
                  },
                  severity: (
                    if .severity == "blocker" or .severity == "critical" or .severity == "major" then "ERROR"
                    elif .severity == "minor" then "WARNING"
                    else "INFO"
                    end
                  ),
                  code: {
                    value: .check_name
                  }
                }' >> "$REPORT_FILE"; then
              HAS_ERROR=1
            fi
          fi

          exit "$HAS_ERROR"
      - if: failure() && github.event_name == 'pull_request'
        name: Upload Check Reports Artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-artifact
          path: |
            ALL_REPORTS.jsonl
            PULL_REQUEST_NUMBER
          retention-days: 7
