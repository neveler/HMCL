name: Check Codes

on:
  push:
    paths:
      - '**.java'
      - '**.properties'
  pull_request:
    paths:
      - '**.java'
      - '**.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Check Codes
        run: ./gradlew checkstyle checkTranslations --no-daemon --parallel --stacktrace
      - if: failure()
        name: Save PR Number
        run: echo "${{ github.event.number }}" > PULL_REQUEST_NUMBER
      - if: failure()
        name: Setup reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
      - if: failure()
        name: Generate Reports
        run: |
          OUTPUT_FILE="ALL_REPORTS.jsonl"
          > "$OUTPUT_FILE"
          find . -path "*/build/reports/checkstyle/*.xml" | while read -r xml_file; do
            if [ -s "$xml_file" ]; then
              echo "Processing $xml_file..."
              cat "$xml_file" | reviewdog -f=checkstyle -name="checkstyle" -reporter=rdjsonl >> "$OUTPUT_FILE"
            else
              echo "Skipping empty or missing report: $xml_file"
            fi
          done
      - if: failure()
        name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-artifact
          path: |
            ALL_REPORTS.jsonl
            PULL_REQUEST_NUMBER
